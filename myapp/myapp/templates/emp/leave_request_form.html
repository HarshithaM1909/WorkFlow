{% extends 'base.html' %}
{% block title %}Request Leave{% endblock %}
{% block content %}
    <div class="container">
        <div class="row">
            <div class="col-md-7 offset-md-2 col-lg-6 offset-lg-3">
                <div class="page-header">
                    <div>
                        <h1><span class="page-icon"><i class="bi bi-calendar-plus-fill"></i></span> Request Leave</h1>
                        <p class="page-subtitle mb-0">Submit a new leave request for approval.</p>
                    </div>
                </div>
                <div class="card">
                    <div class="card-body p-4">
                        <form method="post">
                            {% csrf_token %}
                            {{ form.as_p }}
                            <div class="d-grid mt-3">
                                <button type="submit" class="btn btn-primary"><i class="bi bi-send-fill"></i> Submit Request</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
