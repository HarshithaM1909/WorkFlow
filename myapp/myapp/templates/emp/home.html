{% extends 'base.html' %}
{% block title %}Home{% endblock %}
{% block content %}
    <div class="container">
        <div class="page-header">
            <div>
                <h1><span class="page-icon"><i class="bi bi-people-fill"></i></span> Employees</h1>
                <p class="page-subtitle mb-0">Manage your team's records, roles, and status.</p>
            </div>
            {% if perms.emp.add_emp %}
            <a href="/emp/add-emp/" class="btn btn-primary"><i class="bi bi-person-plus-fill"></i> Add Employee</a>
            {% endif %}
        </div>

        <!-- Search Form -->
        <div class="mb-3">
            <form method="GET" class="input-group" style="max-width: 420px;">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input class="form-control" type="search" name="search"
                       placeholder="Search by name or ID..." aria-label="Search"
                       value="{{ request.GET.search }}"
                       hx-get="/emp/home/"
                       hx-trigger="keyup changed delay=300ms, search"
                       hx-target="#emp-table-wrapper"
                       hx-swap="innerHTML"
                       hx-push-url="true"
                       hx-include="this">
                {% if request.GET.search %}
                    <a href="/emp/home/" class="btn btn-outline-secondary" title="Clear search"><i class="bi bi-x-lg"></i></a>
                {% endif %}
            </form>
        </div>

        <div class="table-responsive-card" id="emp-table-wrapper">
            {% include 'emp/partials/emp_table.html' %}
        </div>
    </div>
{% endblock %}
