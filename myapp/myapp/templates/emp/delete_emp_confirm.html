{% extends 'base.html' %}
{% block title %}Confirm Delete{% endblock %}
{% block content %}
    <div class="container">
        <div class="row">
            <div class="col-md-6 offset-md-3">
                <div class="card">
                    <div class="card-body p-4 text-center">
                        <div class="stat-icon icon-danger mx-auto mb-3" style="width:56px;height:56px;font-size:1.4rem;">
                            <i class="bi bi-exclamation-triangle-fill"></i>
                        </div>
                        <h4 class="mb-2">Delete this employee?</h4>
                        <p class="text-muted-soft">You're about to remove <strong class="text-body">{{ emp.name }}</strong> (ID: {{ emp.emp_id }}). This cannot be undone.</p>
                        <form method="post">
                            {% csrf_token %}
                            <div class="d-flex justify-content-center gap-2 mt-3">
                                <button type="submit" class="btn btn-danger"><i class="bi bi-trash3-fill"></i> Yes, delete</button>
                                <a href="/emp/home/" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
