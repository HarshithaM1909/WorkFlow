{% extends 'base.html' %}
{% block title %}Add Employee{% endblock %}
{% block content %}
    <div class="container">
      <div class="row">
        <div class="col-md-7 offset-md-2 col-lg-6 offset-lg-3">

          <div class="page-header">
              <div>
                  <h1><span class="page-icon"><i class="bi bi-person-plus-fill"></i></span> Add Employee</h1>
                  <p class="page-subtitle mb-0">Create a new employee record.</p>
              </div>
          </div>

          <div class="card">
            <div class="card-body p-4">

                  <form action="/emp/add-emp/" method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                      <label for="name" class="form-label">Employee name</label>
                          <input id='name'
                          type="text"
                          class="form-control"
                          placeholder="Enter employee name"
                          name="emp_name">
                    </div>

                    <div class="mb-3">
                      <label for="id" class="form-label">Employee ID</label>
                          <input
                              id='id'
                              type="text"
                              class="form-control"
                              placeholder="Enter employee ID"
                              name="emp_id">
                    </div>

                    <div class="mb-3">
                      <label for="phone" class="form-label">Phone number</label>
                          <input
                              id='phone'
                              type="text"
                              class="form-control"
                              placeholder="Enter phone number"
                              name="emp_phone">
                    </div>

                    <div class="mb-3">
                      <label for="address" class="form-label">Address</label>
                        <textarea
                        name="emp_address"
                            id="address"
                            class="form-control"
                            rows="4"
                            placeholder="Enter address">
                        </textarea>
                    </div>

                    <div class="mb-3">
                      <label for="role" class="form-label">Role</label>
                      <select name="emp_role" id="role" class="form-select">
                        <option value="">-- Select a role --</option>
                        {% for value, label in roles %}
                            <option value="{{ value }}">{{ label }}</option>
                        {% endfor %}
                      </select>
                    </div>

                    <div class="mb-4 form-check form-switch">
                      <input id='working'
                        type="checkbox"
                        class="form-check-input"
                        role="switch"
                        name="emp_working">
                      <label for="working" class="form-check-label">Currently working</label>
                    </div>

                    <div class="d-grid">
                      <button class="btn btn-primary">
                        <i class="bi bi-check-circle-fill"></i> Add Employee
                      </button>
                    </div>


                  </form>
            </div>
          </div>
        </div>
      </div>
    </div>
{% endblock %}
