<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
        <h2 style="color: #333333; border-bottom: 2px solid #007bff; padding-bottom: 10px;">{{ subject }}</h2>
        
        <p style="font-size: 16px; color: #555555;">Hi <strong>{{ user.username }}</strong>,</p>
        <p style="font-size: 16px; color: #555555; white-space: pre-wrap;">{{ message }}</p>
        
        <p style="font-size: 14px; color: #888888; margin-top: 30px;">Thanks,<br>The Employee Management Team</p>
    </div>
</body>
</html>
