services:
  - type: web
    name: workflow
    env: python
    plan: free
    rootDir: myapp
    buildCommand: >-
      pip install uv &&
      uv sync --locked &&
      uv run python manage.py collectstatic --noinput &&
      uv run python manage.py migrate --noinput
    startCommand: uv run gunicorn myapp.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: 127.0.0.1,localhost
      - key: DATABASE_URL
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      # Optional. Unset by default - CELERY_TASK_ALWAYS_EAGER then defaults to
      # True, so background tasks (e.g. the login-alert email) just run
      # synchronously in the web process instead of needing a Redis add-on
      # and a separate (paid) worker service.
      - key: REDIS_URL
        sync: false
      # Optional. Unset by default - error tracking simply stays disabled
      # until a Sentry DSN is provided.
      - key: SENTRY_DSN
        sync: false
